# 本地端口与根目录 docker-compose.yaml 保持一致。
# 复制为 config.local.yaml；该文件已被 .gitignore 忽略。
app:
  name: "my-im"
  environment: "development"
  auto_migrate: true
  migration_dir: "scripts/migrations"

server:
  port: 18080
  ws_path: "/ws"
  upload_dir: "./uploads"
  frontend_dir: "../frontend/dist"
  allowed_origins: ["http://localhost:5173"]
  read_header_timeout_ms: 5000
  shutdown_timeout_ms: 10000

mysql:
  host: "127.0.0.1"
  port: 13306
  user: "my_im"
  password: "my_im123"
  db_name: "my_im"
  connect_timeout_ms: 3000
  query_timeout_ms: 3000
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime_ms: 300000
  conn_max_idle_time_ms: 60000

redis:
  addr: "127.0.0.1:16379"
  password: ""
  db: 0
  dial_timeout_ms: 3000
  read_timeout_ms: 2000
  write_timeout_ms: 2000
  pool_size: 20
  min_idle_conns: 2
  health_timeout_ms: 1000

rabbitmq:
  url: "amqp://my_im_mq:my_im_mq123@127.0.0.1:5673/"
  connect_timeout_ms: 5000
  publish_timeout_ms: 3000
  retry_count: 3
  retry_backoff_ms: 200
  health_timeout_ms: 1000

observability:
  log_level: "debug"
  metrics_path: "/metrics"
  pprof_addr: "127.0.0.1:16060"

jwt:
  secret: "local-development-only-change-me"
  access_exp_hours: 2
  refresh_exp_days: 7

file:
  max_size_mb: 50
  allowed_exts: ["jpg", "jpeg", "png", "gif", "mp4"]

moment:
  big_user_friend_threshold: 500
  timeline_max_len: 1000
  like_persist_batch_size: 200
  like_persist_flush_ms: 500
  like_cache_ttl_hours: 168
